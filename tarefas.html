<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>


</head>
<body>
    <header class="flex justify-between items-center py-4 px-15 bg-gradient-to-r from bg-violet-800 via-blue-600 to-purple-600">
        <input type="text" placeholder="Pesquisar" class="h-10 pl-4 rounded bg-white">
        <button onclick="abrirFormCriar()" class="leading-10 bg-purple-800 rounded px-4 font-bold text-white duration-200 hover:bg-purple-400 hover:text-black">Nova Tarefa</button>
    </header>

    <main class="p-15 bg-slate-200">
        <h1 class="text 3x1 font-bold mb-6">Tarefas</h1>
        <div id="tarefas" class="grid grid-cols-3 gap-4">
            <div class="bg-white p-4 rounded-lg">
                <div id="overlay" class="w-full h-screen bg-black/70 fixed top-0 left-0 opacity-0 invisible"></div>
                <div id="form-criar" class="w-100 p-4 rounded-lg bg-white top-1/2 left-12 -translate-x-1/2 -translate-y-1/2 opacity-0 invisible>
                    <div class="flex justify-end">
            <box-icon name='x' class="curosr-pointer onclick="fecharFormCriar()"></box-icon>
            </div>
            <form class="flex flex-col">
                <label for="titulo" type="text" class="uppercase text-xs font-bold mb-2 block">
                    Titulo
                </label>
                <input id="titulo" type="text" placeholder="Titulo de tarefa" class="pl-3 h-10 border-2 border-slate-400 focus:border-purple-600 duration-150 rounded outline-none m-4">
                <label for="descricao" class="uppercase text-xs font-bold mb-2 block">Descrição</label>
                <textarea class="pl-3 h-30 border-2 border-slate-400 focus:border-purple-600 duration-150 rounded outliine-none mb-4"></textarea>
                <button type="submit" class="w-full h-10 rounded bg-purple-600 hover:bg-purple-600 duration-200 hover:text-white font-bold">Criar</button>
            </form>

        </div>
        
    </main>

    <script src="index.js"></script>
</body>
</html>
